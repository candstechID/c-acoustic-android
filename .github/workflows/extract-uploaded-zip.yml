name: Extract uploaded C Acoustic source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-c-acoustic-source
  cancel-in-progress: false

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="c-acoustic-android-source.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::File '$ZIP_FILE' tidak ditemukan di root repository. Upload ZIP ke root repository terlebih dahulu."
            exit 1
          fi
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source without replacing this workflow
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="${{ steps.zip.outputs.file }}"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Ekstrak ke direktori sementara agar file workflow yang aktif aman.
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          # Tolak path traversal sederhana dan cari root proyek jika ZIP punya satu folder pembungkus.
          if [[ ! -f "$TEMP_DIR/settings.gradle.kts" && ! -f "$TEMP_DIR/app/build.gradle.kts" ]]; then
            FOUND_SETTINGS="$(find "$TEMP_DIR" -mindepth 2 -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
            if [[ -n "$FOUND_SETTINGS" ]]; then
              PROJECT_ROOT="$(dirname "$FOUND_SETTINGS")"
            else
              PROJECT_ROOT="$TEMP_DIR"
            fi
          else
            PROJECT_ROOT="$TEMP_DIR"
          fi

          # Sinkronkan semua file proyek, tetapi jangan menyentuh repo metadata,
          # workflow yang sedang berjalan, atau ZIP sumber yang diunggah.
          rsync -a --delete             --exclude='/.git/'             --exclude='/.github/workflows/extract-uploaded-zip.yml'             --exclude='/c-acoustic-android-source.zip'             "$PROJECT_ROOT/" ./

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan baru untuk di-commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import C Acoustic Android source from ZIP"
          git push
          
