- name: Extract ZIP without overwriting workflow
  shell: bash
  run: |
    set -euo pipefail

    ZIP_FILE="c-acoustic-android-source.zip"
    TEMP_DIR="$(mktemp -d)"
    trap 'rm -rf "$TEMP_DIR"' EXIT

    test -f "$ZIP_FILE" || {
      echo "ZIP tidak ditemukan: $ZIP_FILE"
      exit 1
    }

    unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

    rsync -a \
      --exclude='.git/' \
      --exclude='.github/workflows/extract-uploaded-zip.yml' \
      "$TEMP_DIR/" ./

    git add -A
    if git diff --cached --quiet; then
      echo "Tidak ada perubahan untuk di-commit."
    else
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git commit -m "Import C Acoustic Android source"
      git push
    fi
