name: Build C Acoustic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do unzip -o "$z" || true; done
          fi
          ls -la

      - name: Find Gradle Dir
        id: find_gradle
        run: |
          FILE=$(find . -name "settings.gradle" | head -1)
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found dir $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2 (FIX HasConvention)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: |
          cd "${{ steps.find_gradle.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Acoustic-APK
          path: ${{ steps.find_gradle.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
