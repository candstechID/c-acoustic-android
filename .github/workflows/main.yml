name: Build C Acoustic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          echo "=== Before extract ==="
          ls -la
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              echo "Extracting $z..."
              unzip -o "$z" || true
            done
          fi
          echo "=== After extract ==="
          ls -la
          find . -name "settings.gradle" -type f

      - name: Find Gradle Dir
        id: find_gradle
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle" | head -1)
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Found: $GRADLE_FILE"
          echo "Dir: $GRADLE_DIR"
          echo "dir=$GRADLE_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd "${{ steps.find_gradle.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Acoustic-APK
          path: ${{ steps.find_gradle.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
