name: Build C Acoustic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle Project Location
        id: find_gradle
        run: |
          echo "Listing root:"
          ls -la
          echo "Finding settings.gradle..."
          GRADLE_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)
          if [ -z "$GRADLE_DIR" ]; then
            GRADLE_DIR="."
          fi
          echo "Gradle dir: $GRADLE_DIR"
          echo "dir=$GRADLE_DIR" >> $GITHUB_OUTPUT
          ls -la "$GRADLE_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd ${{ steps.find_gradle.outputs.dir }}
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Acoustic-APK
          path: ${{ steps.find_gradle.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
