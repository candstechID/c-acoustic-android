name: Build C Acoustic APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          echo "Mencari file ZIP..."
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do 
              echo "Mengekstrak $z..."
              unzip -o "$z" || true
            done
          else
            echo "Tidak ada file ZIP yang ditemukan!"
            exit 1
          fi

      - name: Clean Up Duplicate Files
        run: |
          echo "Membersihkan file duplikat sisa ekstrak ganda (_1, _1_1, _2)..."
          find . -type f -name "*_1.*" -delete
          find . -type f -name "*_1_1.*" -delete
          find . -type f -name "*_2.*" -delete
          find . -type f -name "*_1" -delete
          find . -type f -name "*_2" -delete

      - name: Find Gradle Dir
        id: find_gradle
        run: |
          FILE=$(find . -name "settings.gradle" | head -1)
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found dir $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Fix Repositories in settings.gradle
        run: |
          cd "${{ steps.find_gradle.outputs.dir }}"
          cat <<EOF > settings_new.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat settings.gradle >> settings_new.gradle
          mv settings_new.gradle settings.gradle

      - name: Fix Java and Kotlin Target Mismatch
        run: |
          cd "${{ steps.find_gradle.outputs.dir }}"
          # Mencari file build.gradle di dalam modul aplikasi (app/)
          APP_BUILD=$(find . -name "build.gradle" | grep "app")
          if [ -f "$APP_BUILD" ]; then
            echo "Menyuntikkan konfigurasi Java 17 ke $APP_BUILD"
            cat <<EOF >> "$APP_BUILD"
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          fi

      - name: Inject AndroidX Config & Build APK
        run: |
          cd "${{ steps.find_gradle.outputs.dir }}"
          
          echo "" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          chmod +x ./gradlew 2>/dev/null || true
          
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C-Acoustic-Live-Pro-APK
          path: ${{ steps.find_gradle.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          
