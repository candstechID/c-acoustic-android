name: Build C Acoustic APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto Extract ZIP
        run: |
          echo "Mencari file ZIP..."
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do 
              echo "Mengekstrak $z..."
              unzip -o "$z" || true
            done
          else
            echo "Tidak ada file ZIP yang ditemukan!"
            exit 1
          fi

      - name: Clean Up Duplicate Files (Anti-Error)
        run: |
          echo "Membersihkan file duplikat sisa ekstrak ganda (_1, _1_1, _2)..."
          find . -type f -name "*_1.*" -delete
          find . -type f -name "*_1_1.*" -delete
          find . -type f -name "*_2.*" -delete
          find . -type f -name "*_1" -delete
          find . -type f -name "*_2" -delete

      - name: Find Gradle Dir
        id: find_gradle
        run: |
          FILE=$(find . -name "settings.gradle" | head -1)
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found dir $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
