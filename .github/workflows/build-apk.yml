name: Build C Acoustic APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;27.0.12077973"

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            echo "::error::File gradlew tidak ditemukan di root repository."
            echo "Pastikan Gradle Wrapper (gradlew, gradlew.bat, dan gradle/wrapper/) sudah ada."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-acoustic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
